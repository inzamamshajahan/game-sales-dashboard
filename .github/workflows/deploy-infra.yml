# .github/workflows/deploy-infra.yml
name: Deploy Infrastructure (CloudFormation)

on:
  push:
    branches:
      - main     # Trigger for production infrastructure changes.
      - develop  # Trigger for test infrastructure changes
    paths:
      - 'cloudformation/**' # Only run if files in cloudformation/ directory change
  workflow_dispatch: # Allows manual triggering with environment selection
    inputs:
      environment:
        description: 'Target environment (test or prod)'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }} # From GitHub Secrets
  PROJECT_NAME: game-sales-dashboard # Your project name
  CF_TEMPLATE_FILE: cloudformation/main.yaml

permissions: # Needed for OIDC
  id-token: write
  contents: read # To checkout the repository

jobs:
  deploy_infrastructure:
    name: Deploy CloudFormation Stack
    runs-on: ubuntu-latest
    # Determine environment name and specifics based on trigger
    outputs: # To pass stack_name to other potential jobs if needed
      stack_name: ${{ steps.env_setup.outputs.stack_name }}
      environment_name: ${{ steps.env_setup.outputs.environment_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Specifics
        id: env_setup
        run: |
          ENV_NAME=""
          PARAM_FILE=""
          CF_ROLE_ARN=""
          STACK_NAME_PREFIX="${{ env.PROJECT_NAME }}"
          SSH_KEY_NAME_SECRET=""
          MY_IP_SECRET=""

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_NAME="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            ENV_NAME="test"
          else
            echo "::error::Could not determine environment from trigger."
            exit 1
          fi

          echo "Determined environment: $ENV_NAME"

          if [[ "$ENV_NAME" == "prod" ]]; then
            PARAM_FILE="cloudformation/parameters/prod.json"
            CF_ROLE_ARN="${{ secrets.PROD_AWS_CLOUDFORMATION_ROLE_ARN }}"
            STACK_NAME="${STACK_NAME_PREFIX}-prod-stack"
            SSH_KEY_NAME_SECRET="${{ secrets.PROD_AWS_EC2_SSH_KEY_NAME }}"
            MY_IP_SECRET="${{ secrets.PROD_AWS_MY_IP_CIDR }}"
          elif [[ "$ENV_NAME" == "test" ]]; then
            PARAM_FILE="cloudformation/parameters/test.json"
            CF_ROLE_ARN="${{ secrets.TEST_AWS_CLOUDFORMATION_ROLE_ARN }}"
            STACK_NAME="${STACK_NAME_PREFIX}-test-stack"
            SSH_KEY_NAME_SECRET="${{ secrets.TEST_AWS_EC2_SSH_KEY_NAME }}"
            MY_IP_SECRET="${{ secrets.TEST_AWS_MY_IP_CIDR }}"
          else
            echo "::error::Invalid environment name: $ENV_NAME"
            exit 1
          fi

          echo "environment_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "param_file=$PARAM_FILE" >> $GITHUB_OUTPUT
          echo "cf_role_arn=$CF_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "stack_name=$STACK_NAME" >> $GITHUB_OUTPUT
          echo "ssh_key_name_secret=$SSH_KEY_NAME_SECRET" >> $GITHUB_OUTPUT
          echo "my_ip_secret=$MY_IP_SECRET" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env_setup.outputs.cf_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation Template
        run: |
          echo "Validating CloudFormation template: ${{ env.CF_TEMPLATE_FILE }}"
          aws cloudformation validate-template --template-body file://${{ env.CF_TEMPLATE_FILE }}

      - name: Deploy CloudFormation Stack
        run: |
          echo "Deploying stack: ${{ steps.env_setup.outputs.stack_name }} for environment: ${{ steps.env_setup.outputs.environment_name }}"
          aws cloudformation deploy \
            --stack-name ${{ steps.env_setup.outputs.stack_name }} \
            --template-file ${{ env.CF_TEMPLATE_FILE }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ProjectName=${{ env.PROJECT_NAME }} \
              DbUser=${{ secrets.DB_USER }} \
              DbPassword=${{ secrets.DB_PASSWORD }} \
              DbName=${{ secrets.DB_NAME }} \
              SSHKeyName=${{ steps.env_setup.outputs.ssh_key_name_secret }} \
              MyIP=${{ steps.env_setup.outputs.my_ip_secret }} \
              GitHubOrgRepo=${{ secrets.GITHUB_REPOSITORY }} `# GITHUB_REPOSITORY is a default secret like 'owner/repo'` \
            --parameter-overrides file://${{ steps.env_setup.outputs.param_file }} # Loads env-specific params (e.g., ECRRepoName, InstanceType)

          echo "CloudFormation deployment for ${{ steps.env_setup.outputs.stack_name }} initiated. Check AWS Console for status."

      # Optional: Wait for stack completion (can take a long time)
      # - name: Wait for Stack Completion
      #   if: always() # Run even if previous steps fail to see logs
      #   run: |
      #     echo "Waiting for stack ${{ steps.env_setup.outputs.stack_name }} to complete..."
      #     aws cloudformation wait stack-create-complete --stack-name ${{ steps.env_setup.outputs.stack_name }} || \
      #     aws cloudformation wait stack-update-complete --stack-name ${{ steps.env_setup.outputs.stack_name }}
      #     echo "Stack ${{ steps.env_setup.outputs.stack_name }} deployment complete."